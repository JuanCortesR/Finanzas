<style>
:root{color-scheme:dark;--bg:#000;--card:#141517;--tx:#f1f3f5;--mut:#9aa0a8;--ac:#3b82f6;--ln:#2a2d31;--ok:#60a5fa;--bad:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
*{box-sizing:border-box}html,body{height:100%}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px max(14px,calc((100% - 640px)/2 + 14px)) 28px}
h1{font-size:26px;color:var(--ac);margin:6px 0 12px}h2{font-size:17px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kp div{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px}
.kp small,.mut{color:var(--mut);font-size:13px}.kp b{display:block;font-size:20px;margin-top:2px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--mut);font-weight:600;text-align:right;padding:6px 3px}td{text-align:right;padding:8px 3px;border-top:1px solid var(--ln)}th:first-child,td:first-child{text-align:left}
.sc{overflow-x:auto}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;width:100%}
button{background:var(--ac);color:#fff;border:0;font-weight:600;margin-top:8px}button.s{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}button.d{background:none;color:var(--bad);border:0;width:auto;margin:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;color:var(--mut);display:block;margin:8px 0 3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chip{width:auto;padding:7px 12px;border-radius:20px;margin:0;background:var(--bg);color:var(--tx);border:1px solid var(--ln);font-weight:500}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
nav{flex:none;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav:empty{display:none}
.hc{position:relative;overflow:hidden;border-radius:24px;padding:20px;min-height:158px;margin-bottom:14px;border:1px solid rgba(255,255,255,.09);background:#10131a;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 42%,#0a0c11) 0%,#0c0e13 78%);box-shadow:0 12px 32px rgba(0,0,0,.45);cursor:pointer;-webkit-tap-highlight-color:transparent}
.hc::before{content:"";position:absolute;inset:0;background:radial-gradient(110% 80% at 0% 0%,rgba(255,255,255,.2),rgba(255,255,255,0) 60%);pointer-events:none}
.hc::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.05));pointer-events:none}
.hic{position:relative;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:26px;margin-bottom:14px;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 22px rgba(0,0,0,.35)}
.spk{position:absolute;right:16px;top:18px;width:132px;height:66px;opacity:.8;-webkit-mask-image:linear-gradient(90deg,transparent,#000 55%);mask-image:linear-gradient(90deg,transparent,#000 55%)}
.ht{font-size:21px;font-weight:700;position:relative}.hl{font-size:13px;color:rgba(255,255,255,.66);position:relative}.hv{font-size:27px;font-weight:700;position:relative;margin:2px 0}
.hgo{position:absolute;right:18px;bottom:14px;font-size:28px;color:rgba(255,255,255,.6)}
.hb{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;margin:0;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}input[type=checkbox]{width:26px;height:26px;padding:0;accent-color:var(--ac)}.prow{display:grid;grid-template-columns:30px 1fr 118px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}nav button{flex:1;background:none;color:var(--mut);border:0;border-radius:0;margin:0;padding:12px 2px;font-size:13px}nav button.on{color:var(--ac)}
.row{display:flex;gap:8px;align-items:center}.row input{flex:1}
canvas{max-height:260px}
.th{position:fixed;z-index:98;border-radius:14px;border:2px solid var(--ac);box-shadow:0 0 0 9999px rgba(0,0,0,.78);animation:pl 1.4s ease-in-out infinite;transition:all .25s}@keyframes pl{0%,100%{box-shadow:0 0 0 9999px rgba(0,0,0,.78),0 0 0 0 var(--ac)}50%{box-shadow:0 0 0 9999px rgba(0,0,0,.78),0 0 20px 6px var(--ac)}}.tc{position:fixed;z-index:99;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.6)}</style></head><body><main id="v"></main>
