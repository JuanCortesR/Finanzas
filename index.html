<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#000;--card:#141517;--tx:#f1f3f5;--mut:#9aa0a8;--ac:#3b82f6;--ln:#2a2d31;--ok:#60a5fa;--bad:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,Helvetica,Arial,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:26px;color:var(--ac);margin:6px 0 12px}h2{font-size:17px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kp div{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px}
.kp small,.mut{color:var(--mut);font-size:13px}.kp b{display:block;font-size:20px;margin-top:2px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--mut);font-weight:600;text-align:right;padding:6px 4px}td{text-align:right;padding:8px 4px;border-top:1px solid var(--ln)}th:first-child,td:first-child{text-align:left}
.sc{overflow-x:auto}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;width:100%}
button{background:var(--ac);color:#fff;border:0;font-weight:600;margin-top:8px}button.s{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}button.d{background:none;color:var(--bad);border:0;width:auto;margin:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;color:var(--mut);display:block;margin:8px 0 3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chip{width:auto;padding:7px 12px;border-radius:20px;margin:0;background:var(--bg);color:var(--tx);border:1px solid var(--ln);font-weight:500}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mut);border:0;border-radius:0;margin:0;padding:12px 2px;font-size:13px}nav button.on{color:var(--ac)}
.row{display:flex;gap:8px;align-items:center}.row input{flex:1}
canvas{max-height:260px}
</style></head><body><main id="v"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
let S,tab='res',fil={from:'',to:'',sel:['total']},c1,c2,c3,rm='',ed='',cf='',rcf=0;
try{S=JSON.parse(localStorage.getItem('inv_v1'))}catch(e){}
S=S||{inv:[],e:{}};
const save=()=>{try{localStorage.setItem('inv_v1',JSON.stringify(S))}catch(e){}};
const f=n=>Math.round(n).toLocaleString('es-CO');
const MN=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const lab=k=>{const[y,m]=k.split('-');return MN[m-1]+' '+y.slice(2)};
const nxt=k=>{let[y,m]=k.split('-').map(Number);m++;if(m>12){m=1;y++}return y+'-'+String(m).padStart(2,'0')};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL=['#3b82f6','#9ca3af','#38bdf8','#6366f1','#64748b','#22d3ee','#a5b4fc'];
function mlist(){const ks=Object.keys(S.e).sort();if(!ks.length)return[];const o=[];let k=ks[0];while(k<=ks[ks.length-1]){o.push(k);k=nxt(k)}return o}
function calc(){const L=mlist(),R={};S.inv.forEach(i=>{let s=0;R[i.id]=L.map(m=>{const v=(S.e[m]||{})[i.id]||[0,0];const ini=s;s=ini+v[0]+v[1];return{m,ini,ap:v[0],int:v[1],fin:s}})});return{L,R}}
const sum=(R,ids,j,k)=>ids.reduce((a,id)=>a+R[id][j][k],0);
const cl=n=>n<0?'neg':'pos';
function nav(){const t=[['res','📊','Resumen'],['gra','📈','Gráficas'],['reg','✏️','Registrar'],['aju','⚙️','Ajustes']];
$('#nav').innerHTML=t.map(x=>`<button class="${tab==x[0]?'on':''}" data-a="go" data-p="${x[0]}">${x[1]}<br>${x[2]}</button>`).join('')}
function go(t){tab=t;render()}
function render(){nav();if(c1){c1.destroy();c1=null}if(c2){c2.destroy();c2=null}if(c3){c3.destroy();c3=null}
if(!S.inv.length&&tab!='aju')tab='aju';
({res,gra,reg,aju})[tab]();window.scrollTo(0,0)}

function res(){const{L,R}=calc(),ids=S.inv.map(i=>i.id);
if(!L.length){$('#v').innerHTML='<h1>Resumen</h1><div class="card">Aún no hay datos. Ve a <b>Registrar</b> para ingresar tu histórico.</div>';return}
const n=L.length-1,tot=sum(R,ids,n,'fin'),ap=L.reduce((a,_,j)=>a+sum(R,ids,j,'ap'),0),ren=L.reduce((a,_,j)=>a+sum(R,ids,j,'int'),0);
const card=(nm,r)=>{const a=r.reduce((x,y)=>x+y.ap,0),g=r.reduce((x,y)=>x+y.int,0);return`<div class="card"><b>${esc(nm)}</b><div class="mut">Saldo actual</div><div style="font-size:22px;font-weight:700">$${f(r[r.length-1].fin)}</div><div class="mut">Invertido $${f(a)} · Rendimientos <span class="${cl(g)}">$${f(g)}</span></div></div>`};
$('#v').innerHTML=`<h1>Mis Inversiones 🤓 JD</h1><div class="kp"><div><small>Saldo total</small><b>$${f(tot)}</b></div><div><small>Total invertido</small><b>$${f(ap)}</b></div><div><small>Rendimientos</small><b class="${cl(ren)}">$${f(ren)}</b></div><div><small>Rentabilidad</small><b class="${cl(ren)}">${ap?(ren/ap*100).toFixed(1):0}%</b></div></div>
<h2>Por inversión</h2>${S.inv.map(i=>card(i.name,R[i.id])).join('')}
<h2>Consolidado mensual</h2><div class="card sc"><table><tr><th>Mes</th><th>Aporte</th><th>Interés</th><th>Saldo</th></tr>${L.map((m,j)=>j).reverse().map(j=>`<tr><td>${lab(L[j])}</td><td>${f(sum(R,ids,j,'ap'))}</td><td class="${cl(sum(R,ids,j,'int'))}">${f(sum(R,ids,j,'int'))}</td><td><b>${f(sum(R,ids,j,'fin'))}</b></td></tr>`).join('')}</table></div>`}

function tg(k){const s=fil.sel,i=s.indexOf(k);i<0?s.push(k):s.splice(i,1);if(!s.length)s.push('total');gra()}
function gra(){tab='gra';nav();if(c1){c1.destroy();c1=null}if(c2){c2.destroy();c2=null}if(c3){c3.destroy();c3=null}const{L,R}=calc();
if(L.length<1){$('#v').innerHTML='<h1>Gráficas</h1><div class="card">Registra al menos un mes para ver gráficas.</div>';return}
if(!fil.from||fil.from<L[0])fil.from=L[0];if(!fil.to||fil.to>L[L.length-1])fil.to=L[L.length-1];
const opt=v=>L.map(m=>`<option value="${m}" ${m==v?'selected':''}>${lab(m)}</option>`).join('');
$('#v').innerHTML=`<h1>Gráficas</h1><div class="g2"><div><label>Desde</label><select data-c="from">${opt(fil.from)}</select></div><div><label>Hasta</label><select data-c="to">${opt(fil.to)}</select></div></div>
<div class="chips"><button class="chip ${fil.sel.includes('total')?'on':''}" data-a="tg" data-p="total">Total</button>${S.inv.map(i=>`<button class="chip ${fil.sel.includes(i.id)?'on':''}" data-a="tg" data-p="${i.id}">${esc(i.name)}</button>`).join('')}</div>
<div class="card"><b>Evolución del saldo</b><canvas id="c1"></canvas></div><div class="card"><b>Capital invertido vs rendimientos</b><div class="mut">Acumulado de la selección</div><canvas id="c2"></canvas></div><div class="card"><b>Distribución del saldo</b><div class="mut">Porcentaje por inversión al mes seleccionado en "Hasta"</div><canvas id="c3"></canvas></div>`;
const idx=L.map((m,j)=>j).filter(j=>L[j]>=fil.from&&L[j]<=fil.to),labs=idx.map(j=>lab(L[j])),all=S.inv.map(i=>i.id),
sel=fil.sel.includes('total')?all:fil.sel,mut=getComputedStyle(document.documentElement).getPropertyValue('--mut').trim(),ln=getComputedStyle(document.documentElement).getPropertyValue('--ln').trim();
const ds=[];if(fil.sel.includes('total'))ds.push({label:'Total',data:idx.map(j=>sum(R,all,j,'fin')),borderColor:COL[0],backgroundColor:COL[0],tension:.25});
S.inv.forEach((i,k)=>{if(fil.sel.includes(i.id))ds.push({label:i.name,data:idx.map(j=>R[i.id][j].fin),borderColor:COL[(k+1)%7],backgroundColor:COL[(k+1)%7],tension:.25})});
const sc={x:{ticks:{color:mut},grid:{color:ln}},y:{ticks:{color:mut,callback:v=>v>=1e6?(v/1e6)+'M':v>=1e3?(v/1e3)+'k':v},grid:{color:ln}}};
const tip={callbacks:{label:c=>c.dataset.label+': $'+f(c.parsed.y)}};
c1=new Chart($('#c1'),{type:'line',data:{labels:labs,datasets:ds},options:{responsive:true,plugins:{legend:{labels:{color:mut}},tooltip:tip},scales:sc}});
let ca=0,cg=0;const inv=[],gan=[];L.forEach((m,j)=>{ca+=sum(R,sel,j,'ap');cg+=sum(R,sel,j,'int');inv.push(ca);gan.push(cg)});
c2=new Chart($('#c2'),{type:'bar',data:{labels:labs,datasets:[{label:'Invertido',data:idx.map(j=>inv[j]),backgroundColor:'#64748b'},{label:'Rendimientos',data:idx.map(j=>gan[j]),backgroundColor:'#3b82f6'}]},options:{responsive:true,plugins:{legend:{labels:{color:mut}},tooltip:tip},scales:{x:{...sc.x,stacked:true},y:{...sc.y,stacked:true}}}});
const jj=L.indexOf(fil.to),vals=S.inv.map(i=>R[i.id][jj].fin),tt=vals.reduce((a,b)=>a+b,0)||1;
c3=new Chart($('#c3'),{type:'pie',data:{labels:S.inv.map((i,k)=>i.name+' '+(vals[k]/tt*100).toFixed(1)+'%'),datasets:[{data:vals,backgroundColor:S.inv.map((i,k)=>COL[k%7]),borderColor:'#141517',borderWidth:2}]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{color:mut}},tooltip:{callbacks:{label:c=>' $'+f(c.parsed)}}}}})}

function iniOf(id,m){const{L,R}=calc();let s=0;L.forEach((k,j)=>{if(k<m)s=R[id][j].fin});return s}
function reg(){const L=mlist();if(!rm)rm=L.length?nxt(L[L.length-1]):new Date().toISOString().slice(0,7);
const cur=S.e[rm]||{};
$('#v').innerHTML=`<h1>Registrar mes</h1><div class="card"><label>Mes (puedes elegir meses pasados para cargar tu histórico)</label><input type="month" value="${rm}" data-c="rm">
${S.inv.map(i=>{const v=cur[i.id]||[0,0],ini=iniOf(i.id,rm);return`<h2>${esc(i.name)}</h2><div class="mut">Saldo inicial: $${f(ini)}</div><div class="g2"><div><label>Aporte del mes</label><input type="number" step="any" id="a_${i.id}" value="${v[0]||''}" placeholder="0" data-i="upd"></div><div><label>Intereses ganados</label><input type="number" step="any" id="g_${i.id}" value="${v[1]||''}" placeholder="0" data-i="upd"></div></div><div style="margin-top:8px">Saldo final: <b id="f_${i.id}">$${f(ini+v[0]+v[1])}</b></div>`}).join('')}
<button data-a="sv">Guardar ${lab(rm)}</button></div>
<div class="card mut">Si es tu primer mes y ya tenías dinero invertido, ingrésalo como aporte. Los meses sin datos mantienen el saldo anterior.</div>`}
function upd(){S.inv.forEach(i=>{const a=+$('#a_'+i.id).value||0,g=+$('#g_'+i.id).value||0;$('#f_'+i.id).textContent='$'+f(iniOf(i.id,rm)+a+g)})}
function sv(){S.e[rm]=S.e[rm]||{};S.inv.forEach(i=>{S.e[rm][i.id]=[+$('#a_'+i.id).value||0,+$('#g_'+i.id).value||0]});save();rm=nxt(rm);tab='res';render()}

function addI(){const n=$('#ni').value.trim();if(!n)return;S.inv.push({id:'i'+Date.now(),name:n});save();aju()}
function ren(id){ed=id;aju()}
function rsave(id){const n=$('#en').value.trim();if(n){S.inv.find(x=>x.id==id).name=n;save()}ed='';aju()}
function del(id){if(cf!=id){cf=id;aju();return}S.inv=S.inv.filter(i=>i.id!=id);Object.values(S.e).forEach(e=>delete e[id]);fil.sel=['total'];cf='';save();aju()}
function bk(){const t=JSON.stringify(S),b=$('#bx');b.value=t;b.focus();b.select();b.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}
try{navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>ok=true).catch(()=>{})}catch(e){}
$('#msg').textContent=ok?'✅ Respaldo copiado. Pégalo en Notas para guardarlo.':'Respaldo generado en el cuadro. Si no se copió: mantén presionado el texto → Seleccionar todo → Copiar, y pégalo en Notas.'}
function rs(){let d;try{d=JSON.parse($('#bx').value);if(!d.inv||!d.e)throw 0}catch(e){$('#msg').textContent='❌ El respaldo no es válido. Pega primero el texto completo.';return}
if(!rcf){rcf=1;$('#msg').textContent='Esto reemplaza tus datos actuales. Toca "Restaurar respaldo" otra vez para confirmar.';return}
rcf=0;S=d;save();tab='res';render()}
function aju(){tab='aju';rcf=0;nav();
$('#v').innerHTML=`<h1>Ajustes</h1>${S.inv.length?'':'<div class="card"><b>¡Bienvenido!</b><br>Empieza agregando tus inversiones (ej: Cajita, Dafuturo). Luego ve a <b>Registrar</b> y carga tus meses históricos.</div>'}
<div class="card"><b>Mis inversiones</b>${S.inv.map(i=>ed==i.id?`<div class="row" style="margin-top:8px"><input id="en" value="${esc(i.name)}"><button data-a="rsave" data-p="${i.id}" style="width:auto;margin:0">Guardar</button></div>`:`<div class="row" style="justify-content:space-between;margin-top:8px"><span>${esc(i.name)}</span><span><button class="d" data-a="ren" data-p="${i.id}" style="color:var(--ac)">Renombrar</button> <button class="d" data-a="del" data-p="${i.id}">${cf==i.id?'¿Seguro? Toca otra vez':'Eliminar'}</button></span></div>`).join('')}
<div class="row" style="margin-top:12px"><input id="ni" placeholder="Nombre de la inversión"><button data-a="addI" style="width:auto;margin:0">Agregar</button></div></div>
<div class="card"><b>Respaldo de datos</b><div class="mut">Tus datos se guardan en este dispositivo. Toca "Generar y copiar respaldo": aparece un texto en el cuadro; guárdalo en Notas. Para recuperar tus datos, pega ese texto en el cuadro y toca Restaurar.</div><button data-a="bk">Generar y copiar respaldo</button><div id="msg" class="mut" style="margin-top:8px"></div><textarea id="bx" rows="4" placeholder="Aquí aparece tu respaldo / pega uno para restaurar" style="width:100%;font:13px monospace;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px;margin-top:8px"></textarea><button class="s" data-a="rs">Restaurar respaldo</button></div>`}
const A={go:t=>go(t),tg,sv,addI,bk,rs,ren,del,rsave};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.p)});
document.addEventListener('change',e=>{const c=e.target.dataset.c;if(!c)return;const v=e.target.value;if(c=='from'){fil.from=v;gra()}else if(c=='to'){fil.to=v;gra()}else if(c=='rm'){rm=v||rm;reg()}});
document.addEventListener('input',e=>{if(e.target.dataset.i=='upd')upd()});
render();
</script></body></html>
