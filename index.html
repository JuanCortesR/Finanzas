<style>
:root{color-scheme:dark;--bg:#000;--card:#141517;--tx:#f1f3f5;--mut:#9aa0a8;--ac:#3b82f6;--ln:#2a2d31;--ok:#60a5fa;--bad:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,Helvetica,Arial,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:26px;color:var(--ac);margin:6px 0 12px}h2{font-size:17px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kp div{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px}
.kp small,.mut{color:var(--mut);font-size:13px}.kp b{display:block;font-size:20px;margin-top:2px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--mut);font-weight:600;text-align:right;padding:6px 3px}td{text-align:right;padding:8px 3px;border-top:1px solid var(--ln)}th:first-child,td:first-child{text-align:left}
.sc{overflow-x:auto}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;width:100%}
button{background:var(--ac);color:#fff;border:0;font-weight:600;margin-top:8px}button.s{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}button.d{background:none;color:var(--bad);border:0;width:auto;margin:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;color:var(--mut);display:block;margin:8px 0 3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chip{width:auto;padding:7px 12px;border-radius:20px;margin:0;background:var(--bg);color:var(--tx);border:1px solid var(--ln);font-weight:500}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mut);border:0;border-radius:0;margin:0;padding:12px 2px;font-size:13px}nav button.on{color:var(--ac)}
.row{display:flex;gap:8px;align-items:center}.row input{flex:1}
canvas{max-height:260px}
